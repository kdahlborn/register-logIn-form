<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login page</title>
        <link rel="stylesheet" href="./style.css" />
        <script src="./script.js" defer></script>
    </head>
    <body>
        <section class="wrapper">
            <h1 class="title" id="title"></h1>
            <p class="error-msg" id="errorMsg"></p>
            <!-- LOGIN FORM -->
            <form class="form" id="loginForm">
                <label class="form__label">
                    Username:
                    <input type="text" id="username" class="form__input" />
                </label>
                <label class="form__label">
                    Password:
                    <input type="password" id="password" class="form__input" />
                </label>
                <button class="btn" id="loginBtn">Login</button>
                <p class="form__text">Dont have an account?</p>
                <button class="btn btn--empty" id="registerSection">
                    Register Account
                </button>
            </form>

            <!-- REGISTER FORM -->
            <form class="form" id="registerForm">
                <label class="form__label">
                    Username:
                    <input type="text" id="setUsername" class="form__input" />
                </label>
                <label class="form__label">
                    Password:
                    <input
                        type="password"
                        id="setPassword"
                        class="form__input"
                    />
                </label>
                <label class="form__label">
                    Repeat password:
                    <input
                        type="password"
                        id="repeatPassword"
                        class="form__input"
                    />
                </label>
                <label class="form__label form__label--row">
                    I have read and accept the terms of service
                    <input
                        type="checkbox"
                        id="checkbox"
                        class="form__checkbox"
                    />
                </label>
                <button class="btn" id="registerBtn">Register Account</button>
                <p class="form__text">Already have an account?</p>
                <button class="btn btn--empty" id="loginSection">Login</button>
            </form>

            <!-- CONFIRMATION -->
            <article class="confirm" id="confirm">
                <img
                    src="./images/check.png"
                    alt="check sign"
                    class="confirm__img"
                />
                <button class="btn" id="confirmBtn">Login</button>
            </article>
        </section>
    </body>
</html>
